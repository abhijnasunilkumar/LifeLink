<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LifeLink</title>

    <link rel="stylesheet" href="register.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- Navbar -->

<header>

    <div class="logo">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>LifeLink</span>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="register.html" class="active">Become a Donor</a></li>
            <li><a href="search.html">Find a Donor</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<!-- Hero -->

<section class="hero">

    <h1>Become a Blood Donor ❤️</h1>

    <p>
        Register today and help save someone's life.
    </p>

</section>

<!-- Registration Form -->

<section class="register">

<form id="registerForm">

<form id="registerForm">

<h2>Donor Registration Form</h2>

<div class="input-box">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter phone number" required>
</div>

<div class="input-box">
<label>Age</label>
<input type="number" id="age" placeholder="Age" required>
</div>

<div class="input-box">
<label>Gender</label>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

</div>

<div class="input-box">
<label>Blood Group</label>

<select id="bloodGroup" required>
<option value="">Select Blood Group</option>

<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>AB-</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>


</select>

</div>

<div class="input-box">
<label>City</label>
<input type="text" id="city" placeholder="Enter your city" required>
</div>

<div class="input-box">
<label>Address</label>
<textarea id="address" placeholder="Enter your address" required></textarea>
</div>

<div class="input-box">
<label>Last Blood Donation Date</label>
<input type="date" id="lastDonation" required>
</div>

<button type="submit">Register Now</button>

</form>

</section>
<script src="register.js"></script>
</body>
</html>
